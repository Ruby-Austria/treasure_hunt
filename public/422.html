<!DOCTYPE html>
<html lang="en">
<head>
  <title>Request Rejected — RubyConf Treasure Hunt</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #faf9f7;
      color: #1a1a2e;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 28rem;
    }
    .code {
      font-size: 5rem;
      font-weight: 800;
      color: #e30818;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #6b7280;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #e30818;
      color: #fff;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    a.btn:hover { background: #b5060f; }
    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
    .footer a { color: #e30818; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">422</div>
    <h1>Request Rejected</h1>
    <p>Your request couldn't be processed. This can happen if your session expired. Please go back and try again.</p>
    <a href="/" class="btn">Back to Home</a>
    <div class="footer">
      <a href="https://rubyconf.at">RubyConf Austria 2026</a> &middot; Vienna
    </div>
  </div>
</body>
</html>
